services:
  postgres:
    image: postgres:17-alpine
    container_name: sdu_stock_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${DB_NAME:-sdu_inventory}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres-stock-data:/var/lib/postgresql/data
      - ./backend/schema_postgres.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  pgadmin:
    image: dpage/pgadmin4
    container_name: sdu_stock_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-root}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT:-5051}:80"
    volumes:
      - ./pgadmin_servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build: .
    container_name: sdu_stock_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PORT:-8080}:8080"
    environment:
      DB_TYPE: ${DB_TYPE:-postgres}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgrespassword}
      DB_NAME: ${DB_NAME:-sdu_inventory}
      PORT: 8080
      HOST: 0.0.0.0
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      API_BASE_URL: ${API_BASE_URL:-/api}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      STAFF_USERNAME: ${STAFF_USERNAME:-admin_staff}
      STAFF_PASSWORD: ${STAFF_PASSWORD:-sdu1234}
      STAFF_AUTH_SECRET: ${STAFF_AUTH_SECRET:-sdu_inventory_staff_secret_token_change_in_production}
      DEFAULT_USER_PASSWORD: ${DEFAULT_USER_PASSWORD:-sdu1234}
      REQUESTER_AUTH_SECRET: ${REQUESTER_AUTH_SECRET:-sdu_inventory_requester_secret_token_change_in_production}
      AUTH_BYPASS: ${AUTH_BYPASS:-false}

volumes:
  postgres-stock-data:

