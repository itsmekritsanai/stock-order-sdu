version: '3.8'

services:
  # PostgreSQL Database Server
  db:
    image: postgres:16-alpine
    container_name: sdu_stock_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sdu_stock_db}
      POSTGRES_USER: ${POSTGRES_USER:-sdu_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sdu_secure_pass123}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sdu_admin} -d ${POSTGRES_DB:-sdu_stock_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # pgAdmin 4 - Web-based Database Administration UI
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: sdu_stock_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@dusit.ac.th}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin1234}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
